<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>我的简易博客</title>
  <style>
    :root{--bg:#f6f8fa;--card:#fff;--muted:#6b7280;--accent:#0ea5a4;}
    body{font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial; margin:0; background:var(--bg); color:#111}
    header{background:linear-gradient(90deg,#056b6e,#0ea5a4); color:#fff; padding:24px 20px}
    header h1{margin:0;font-size:20px}
    .container{display:flex;gap:20px;padding:20px;max-width:1050px;margin:0 auto}
    .sidebar{width:300px}
    .card{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 6px 18px rgba(12,12,13,0.06)}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    button{background:var(--accent);color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
    button.ghost{background:transparent;color:var(--accent);border:1px solid rgba(14,165,164,0.15)}
    .small{padding:6px 8px;font-size:13px;border-radius:6px}
    input[type=text]{width:100%;padding:8px;border-radius:8px;border:1px solid #e6e9ee}
    textarea{width:100%;min-height:220px;padding:8px;border-radius:8px;border:1px solid #e6e9ee;font-family:inherit}
    .post-list{margin-top:12px;display:flex;flex-direction:column;gap:10px}
    .post-item{padding:10px;border-radius:8px;border:1px solid #f0f2f4;cursor:pointer}
    .post-item h3{margin:0 0 6px 0;font-size:16px}
    .meta{color:var(--muted);font-size:13px}
    .viewer{flex:1;min-height:400px}
    .viewer .post{padding:20px;background:var(--card);border-radius:10px;box-shadow:0 6px 18px rgba(12,12,13,0.04)}
    .viewer .post h2{margin-top:0}
    .actions{display:flex;gap:8px;margin-top:12px}
    footer{padding:16px;text-align:center;color:var(--muted);font-size:13px}
    pre{background:#0f1720;color:#d1fae5;padding:12px;border-radius:8px;overflow:auto}
    a.link{color:var(--accent);text-decoration:none}
    .note{font-size:13px;color:var(--muted);margin-bottom:8px}
  </style>
</head>
<body>
  <header>
    <div style="max-width:1050px;margin:0 auto;display:flex;justify-content:space-between;align-items:center">
      <h1>我的简易博客</h1>
      <div style="font-size:14px;opacity:0.95">本地保存 · 支持 Markdown · 可导出导入</div>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <strong>写新文章</strong>
          <div class="note">按需发布、保存到浏览器</div>
        </div>

        <div style="margin-top:8px" id="editor-area">
          <input type="text" id="post-title" placeholder="标题 (必填)" />
          <div style="height:8px"></div>
          <input type="text" id="post-author" placeholder="作者 (可选)" />
          <div style="height:8px"></div>
          <textarea id="post-content" placeholder="正文（支持 Markdown）"></textarea>
          <div style="height:8px"></div>
          <div class="controls">
            <button id="save-post">保存并发布</button>
            <button class="ghost small" id="clear-editor">清空</button>
            <button class="ghost small" id="insert-sample">插入示例</button>
          </div>
        </div>

        <hr />

        <div style="display:flex;justify-content:space-between;align-items:center">
          <strong>管理</strong>
          <div class="note" style="text-align:right">导出/导入 备份</div>
        </div>
        <div style="margin-top:8px" class="controls">
          <button class="small ghost" id="export-posts">导出 JSON</button>
          <button class="small ghost" id="import-posts">导入 JSON</button>
          <button class="small ghost" id="clear-all">清空全部</button>
        </div>
        <input type="file" id="import-file" accept="application/json" style="display:none" />
      </div>

      <div style="height:12px"></div>

      <div class="card">
        <strong>文章列表</strong>
        <div class="note" style="margin-top:6px">点击文章查看</div>
        <div class="post-list" id="post-list"></div>
      </div>
    </aside>

    <main class="viewer">
      <div class="card" id="main-view">
        <div id="empty-view" style="padding:40px;text-align:center;color:var(--muted)">
          请选择一篇文章或写一篇新的。<br/><br/>
          Tip: 保存文章后会出现在左侧列表，支持 Markdown 渲染。
        </div>

        <div id="post-view" style="display:none">
          <div class="post" id="post-content-render">
            <!-- 渲染文章 -->
          </div>
          <div class="actions">
            <button id="edit-post">编辑</button>
            <button class="ghost" id="delete-post">删除</button>
            <button class="ghost" id="copy-link">复制链接</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <footer>保存位置：浏览器 localStorage · 若要公开展示请部署到 GitHub Pages</footer>

  <script>
    // 存储键（根据你的 repo 或用户名可以改）
    const STORAGE_KEY = 'blog_hjq759_one_1410162820_v1';

    // 简单的 Markdown -> HTML 转换器（支持常用语法）
    function escapeHtml(str){
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function mdToHtml(md){
      if(!md) return '';
      // 处理代码块 ```lang\n...\n```
      md = md.replace(/```([\\s\\S]*?)```/g, function(m, code){
        return '<pre><code>' + escapeHtml(code) + '</code></pre>';
      });
      // 行按段落分割
      const lines = md.split(/\r?\n/);
      let out = '', buffer = [];
      const flushBuffer = () => {
        if(buffer.length===0) return;
        let text = buffer.join('\n');
        // 标题
        if(/^#{1,6} /.test(text.trim())){
          text = text.replace(/^#{1,6} (.*)/, (m, t)=>'<h'+(m.trim().match(/^#+/)[0].length)+ '>' + parseInline(t) + '</h'+(m.trim().match(/^#+/)[0].length)+ '>');
          out += text;
        } else if(/^[\-*+]\s+/.test(text) || /^\d+\.\s+/.test(text)) {
          // 列表（简单实现，只支持单段列表）
          const items = text.split(/\n/).map(l=>l.replace(/^[\-*+\d\.]+\s+/, ''));
          out += '<ul>' + items.map(i=>'<li>'+parseInline(i)+'</li>').join('') + '</ul>';
        } else {
          out += '<p>' + parseInline(text).replace(/\n/g,'<br/>') + '</p>';
        }
        buffer = [];
      };

      function parseInline(s){
        s = escapeHtml(s);
        // 链接 [text](url)
        s = s.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a class="link" href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        // 粗体 **text**
        s = s.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');
        // 斜体 *text*
        s = s.replace(/\*([^\*]+)\*/g, '<em>$1</em>');
        // 行内代码 `code`
        s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
        return s;
      }

      for(let i=0;i<lines.length;i++){
        const line = lines[i];
        if(line.trim()===''){
          flushBuffer();
          continue;
        }
        // 标题行或列表开头或代码块已经处理 -> 直接 flush single line
        if(/^#{1,6} /.test(line) || /^[\-*+]\s+/.test(line) || /^\d+\.\s+/.test(line)){
          buffer.push(line);
          flushBuffer();
          continue;
        }
        buffer.push(line);
      }
      flushBuffer();
      return out;
    }

    // 数据操作
    function loadPosts(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return [];
        return JSON.parse(raw);
      }catch(e){ console.error(e); return []; }
    }
    function savePosts(posts){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
    }
    function addOrUpdatePost(post){
      const posts = loadPosts();
      const idx = posts.findIndex(p=>p.id===post.id);
      if(idx>=0){
        posts[idx] = post;
      } else {
        posts.push(post);
      }
      savePosts(posts);
      renderList();
    }
    function deletePostById(id){
      let posts = loadPosts();
      posts = posts.filter(p=>p.id!==id);
      savePosts(posts);
      renderList();
    }

    // UI
    const postListEl = document.getElementById('post-list');
    const titleEl = document.getElementById('post-title');
    const authorEl = document.getElementById('post-author');
    const contentEl = document.getElementById('post-content');
    const saveBtn = document.getElementById('save-post');
    const clearBtn = document.getElementById('clear-editor');
    const insertSampleBtn = document.getElementById('insert-sample');
    const exportBtn = document.getElementById('export-posts');
    const importBtn = document.getElementById('import-posts');
    const importFileInput = document.getElementById('import-file');
    const clearAllBtn = document.getElementById('clear-all');

    const emptyView = document.getElementById('empty-view');
    const postView = document.getElementById('post-view');
    const postContentRender = document.getElementById('post-content-render');
    const editPostBtn = document.getElementById('edit-post');
    const deletePostBtn = document.getElementById('delete-post');
    const copyLinkBtn = document.getElementById('copy-link');

    let currentViewingId = null;

    function renderList(){
      const posts = loadPosts().sort((a,b)=>b.createdAt - a.createdAt);
      postListEl.innerHTML = '';
      if(posts.length===0){
        postListEl.innerHTML = '<div style="color:var(--muted)">暂无文章，写一篇试试！</div>';
        return;
      }
      posts.forEach(p=>{
        const el = document.createElement('div');
        el.className = 'post-item';
        el.innerHTML = '<h3>' + (p.title||'(无标题)') + '</h3><div class="meta">' + (p.author?escapeHtml(p.author)+' · ' : '') + new Date(p.createdAt).toLocaleString() + '</div>';
        el.addEventListener('click', ()=>{ showPost(p.id); });
        postListEl.appendChild(el);
      });
    }

    function showPost(id){
      const posts = loadPosts();
      const p = posts.find(x=>x.id===id);
      if(!p) return;
      currentViewingId = id;
      location.hash = 'post-' + id;
      emptyView.style.display = 'none';
      postView.style.display = 'block';
      // 渲染
      const html = '<h2>' + escapeHtml(p.title) + '</h2>' +
                   '<div class="meta">' + (p.author?escapeHtml(p.author)+' · ':'') + new Date(p.createdAt).toLocaleString() + '</div>' +
                   '<hr />' +
                   mdToHtml(p.content || '');
      postContentRender.innerHTML = html;
    }

    function clearEditor(){
      titleEl.value = '';
      authorEl.value = '';
      contentEl.value = '';
    }

    saveBtn.addEventListener('click', ()=>{
      const title = titleEl.value.trim();
      const content = contentEl.value.trim();
      const author = authorEl.value.trim();
      if(!title){
        alert('请输入标题');
        return;
      }
      const id = 'p' + Date.now();
      const p = {
        id,
        title,
        author,
        content,
        createdAt: Date.now()
      };
      addOrUpdatePost(p);
      clearEditor();
      showPost(p.id);
      alert('已保存');
    });

    clearBtn.addEventListener('click', ()=>{
      if(confirm('清空编辑区吗？')) clearEditor();
    });

    insertSampleBtn.addEventListener('click', ()=>{
      titleEl.value = '示例文章：欢迎使用';
      authorEl.value = '作者';
      contentEl.value = [
        '# 欢迎',
        '',
        '这是一个示例文章，你可以使用 **Markdown** 来编写正文。',
        '',
        '常见用法：',
        '',
        '- 标题：以 # 开头',
        '- 粗体：**加粗**',
        '- 斜体：*斜体*',
        '- 链接：[文本](https://example.com)',
        '',
        '```',
        '代码块示例',
        'function hello(){ return "hi"; }',
        '```'
      ].join('\n');
    });

    exportBtn.addEventListener('click', ()=>{
      const posts = loadPosts();
      const blob = new Blob([JSON.stringify(posts, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'blog-posts.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    importBtn.addEventListener('click', ()=> importFileInput.click());
    importFileInput.addEventListener('change', (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          const data = JSON.parse(ev.target.result);
          if(!Array.isArray(data)) throw new Error('格式不正确，应为文章数组');
          if(!confirm('将导入 ' + data.length + ' 篇文章（合并到现有文章中）。继续？')) return;
          const existing = loadPosts();
          const merged = existing.concat(data.filter(d=>d && d.id).map(d=>({id:d.id,title:d.title||'',author:d.author||'',content:d.content||'',createdAt:d.createdAt||Date.now()})));
          savePosts(merged);
          renderList();
          alert('导入完成');
        }catch(err){
          alert('导入失败：' + err.message);
        }
      };
      reader.readAsText(f,'utf-8');
      importFileInput.value = '';
    });

    clearAllBtn.addEventListener('click', ()=>{
      if(!confirm('确定要删除本地所有文章吗？此操作无法撤销（除非你已导出备份）。')) return;
      localStorage.removeItem(STORAGE_KEY);
      renderList();
      emptyView.style.display = 'block';
      postView.style.display = 'none';
      location.hash = '';
    });

    // 查看/编辑/删除 当前文章
    editPostBtn.addEventListener('click', ()=>{
      if(!currentViewingId) return;
      const posts = loadPosts();
      const p = posts.find(x=>x.id===currentViewingId);
      if(!p) return;
      // 填回编辑区
      titleEl.value = p.title;
      authorEl.value = p.author || '';
      contentEl.value = p.content || '';
      // 切换视图：手动滚动到编辑区
      window.scrollTo({top:0,behavior:'smooth'});
    });

    deletePostBtn.addEventListener('click', ()=>{
      if(!currentViewingId) return;
      if(!confirm('确认删除这篇文章吗？')) return;
      deletePostById(currentViewingId);
      currentViewingId = null;
      emptyView.style.display = 'block';
      postView.style.display = 'none';
      location.hash = '';
    });

    copyLinkBtn.addEventListener('click', ()=>{
      if(!currentViewingId) return;
      const url = location.href.split('#')[0] + '#post-' + currentViewingId;
      navigator.clipboard?.writeText(url).then(()=>alert('链接已复制')).catch(()=>{ prompt('手动复制文章链接：', url); });
    });

    // 页面加载：渲染列表并响应 hash（支持打开具体文章）
    function handleHash(){
      const h = location.hash || '';
      if(h.startsWith('#post-')){
        const id = h.slice(6);
        showPost(id);
      } else {
        // 默认隐藏文章视图
        emptyView.style.display = 'block';
        postView.style.display = 'none';
      }
    }

    window.addEventListener('hashchange', handleHash);

    // 初始示例文章（仅当没有任何文章时加入）
    function ensureSample(){
      const posts = loadPosts();
      if(posts.length===0){
        const p = {
          id: 'p' + Date.now(),
          title: '示例：如何使用这个博客',
          author: 'system',
          content: [
            '这是你的第一个示例文章。它保存在浏览器 localStorage 中。',
            '',
            '你可以：',
            '',
            '- 在左上角输入标题和正文，然后点击「保存并发布」。',
            '- 在左侧列表点击文章以查看。',
            '- 点击「导出 JSON」备份文章，或用「导入 JSON」恢复。',
            '',
            '若想公开展示，请将此 index.html 上传到仓库并启用 GitHub Pages。'
          ].join('\n'),
          createdAt: Date.now()
        };
        savePosts([p]);
      }
    }

    // 初始执行
    ensureSample();
    renderList();
    handleHash();

    // 小工具：安全打印 escapeHtml 到页面（用于 meta)
    function escapeHtml(s){
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
